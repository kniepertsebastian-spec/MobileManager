# Phase 4.0: Build, Lint und Tests bei jedem Push und Pull Request.
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Debug-APK und Instrumentation-Tests bauen
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Release-Build mit R8 (ohne Secrets, unsigniert)
        # Ohne keystore.properties/MM_*-Variablen baut Gradle ein unsigniertes Release – genug, um
        # R8-/ProGuard-Fehler (fehlende Keep-Regeln, Reflection, ServiceLoader, AIDL) sofort zu sehen.
        run: ./gradlew --stacktrace assembleRelease

      - name: R8-Keep-Regeln im Release-APK prüfen
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -n1)
          unzip -o -q "$APK" 'classes*.dex' -d build/r8-check
          for dex in build/r8-check/classes*.dex; do "$DEXDUMP" "$dex"; done > build/r8-check/dump.txt
          for cls in \
            'Lapp/mobilemanager/data/shizuku/ShellService;' \
            'Lapp/mobilemanager/data/shizuku/IShellService$Stub;' \
            'Lorg/eclipse/angus/mail/smtp/SMTPTransport;' \
            'Lcom/google/mlkit/common/internal/CommonComponentRegistrar;' \
            'Lapp/mobilemanager/data/local/AppDatabase_Impl;' \
            'Lapp/mobilemanager/launcher/data/LauncherDatabase_Impl;'; do
            grep -qF "Class descriptor  : '$cls'" build/r8-check/dump.txt || { echo "Fehlt im Release-APK: $cls"; exit 1; }
          done
          # Shizuku erzeugt den UserService über den Konstruktor ShellService(Context).
          sed -n "/Class descriptor  : 'Lapp\/mobilemanager\/data\/shizuku\/ShellService;'/,/^Class #/p" build/r8-check/dump.txt \
            | grep -A1 "'<init>'" | grep -qF "(Landroid/content/Context;)V" || { echo "ShellService(Context) fehlt"; exit 1; }

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            feature-launcher/build/reports/
          retention-days: 7

  # Roadmap v2 D.2: Instrumentation-Tests (Room-Migrationen beider Datenbanken, Sicherheit, Backup/EXIF,
  # Screen-Smoke-Tests) auf einem Emulator – nur für Pull Requests und main, weil der Lauf länger dauert.
  instrumentation:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation-Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew --stacktrace connectedDebugAndroidTest

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            feature-launcher/build/reports/androidTests/
          retention-days: 7
