# Phase 4.0: Build, Lint und Tests bei jedem Push und Pull Request.
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Debug-APK und Instrumentation-Tests bauen
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Release-Build mit R8
        run: ./gradlew --stacktrace assembleRelease

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            feature-launcher/build/reports/
          retention-days: 7
